<table class="sm:bg-white bg-gray-100" cellpadding="0" cellspacing="0" role="presentation" width="100%">
    <tr>
        <td align="center" valign="top">
            <table cellpadding="0" cellspacing="0" role="presentation" width="600px">
                <tbody>
                    <tr>
                        <td style="background-color:#1E293B; padding:20px 32px;">
                            <!-- Rebrand: Accurate Systems dark email header matching prototype -->
                            <img src="https://accuratesystems.com.sa/wp-content/uploads/2025/12/logo-new.png"
                                alt="Accurate Systems" width="32" height="32"
                                style="display:inline-block; vertical-align:middle;" />
                            <span style="color:#ffffff; font-size:15px; font-weight:600; margin-left:12px; vertical-align:middle;">
                            {% if title %}
                                {{ title }}
                            {% else %}
                                Accurate Systems Cloud
                            {% endif %}
                            </span>
                        </td>
                    </tr>
                    <tr>
                        {% block content %}{% endblock %}
                    </tr>
                    <tr>
                        <td class="py-8">
                            &nbsp;
                        </td>
                    </tr>
                </tbody>
            </table>
        </td>
    </tr>
</table>
