<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Press Server pages: before / after</title>
<style>
  :root{
    --bg:#f4f5f6; --panel:#ffffff; --border:#e9eaec; --border-2:#dfe1e4;
    --ink:#1c2024; --ink-2:#6b7178; --ink-3:#8b9198; --hover:#f4f5f6; --active:#ededf0;
    --green:#18794e; --green-bg:#e7f4ec; --red:#c0392b; --red-bg:#fbe9e7;
    --amber:#b9560a; --amber-bg:#fcf1e3; --blue:#2463eb; --blue-bg:#eef3ff;
    --solid:#1f2225; --new:#eef5ff; --new-line:#bcd5ff; --radius:6px;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}
  .mono{font-family:var(--mono)}
  /* sidebar */
  .sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:8px;padding:10px;margin:6px;border-radius:var(--radius)}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--solid);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
  .brand .nm{font-size:13px;font-weight:600;line-height:1.2}.brand .em{font-size:11px;color:var(--ink-3)}
  nav{padding:4px 8px}
  .nav-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--radius);color:var(--ink-2);cursor:pointer;font-size:13.5px;margin-bottom:1px}
  .nav-item:hover{background:var(--hover);color:var(--ink)}
  .nav-item.active{background:var(--active);color:var(--ink);font-weight:550}
  .nav-item .ic{width:16px;height:16px;display:grid;place-items:center;color:var(--ink-3)} .ic svg{width:15px;height:15px}
  .nav-item.active .ic{color:var(--ink)}
  /* main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .babar{height:46px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 18px;background:#fbfcfd}
  .babar .lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
  .ba{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--radius);overflow:hidden}
  .ba button{background:var(--panel);border:none;padding:5px 16px;font-size:12.5px;cursor:pointer;font-family:var(--font);color:var(--ink-2);font-weight:550}
  .ba button+button{border-left:1px solid var(--border-2)}
  .ba button.on.before{background:var(--ink);color:#fff}
  .ba button.on.after{background:var(--blue);color:#fff}
  .babar .desc{font-size:12px;color:var(--ink-3);margin-left:4px}
  .legend{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3)}
  .legend .sw{width:22px;height:12px;border-radius:3px;background:var(--new);border:1px solid var(--new-line)}
  .topbar{height:46px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--panel)}
  .crumb{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2)}
  .crumb a{color:var(--ink-2);text-decoration:none;cursor:pointer}.crumb a:hover{color:var(--ink)}
  .crumb .cur{color:var(--ink);font-weight:550}.crumb .sep{color:var(--border-2)}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--green);animation:p 1.6s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
  .content{padding:16px 22px 80px;overflow:auto}
  /* filter bar */
  .filterbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .fctl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-2);background:var(--panel);border-radius:var(--radius);padding:5px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
  .fctl svg{width:13px;height:13px}
  .search{flex:0 0 200px;border:1px solid var(--border-2);border-radius:var(--radius);padding:5px 10px;font-size:12.5px;color:var(--ink-3)}
  .seg{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--radius);overflow:hidden}
  .seg button{background:var(--panel);border:none;color:var(--ink-2);padding:4px 11px;font-size:12.5px;cursor:pointer;font-family:var(--font)}
  .seg button+button{border-left:1px solid var(--border-2)}.seg button.on{background:var(--active);color:var(--ink);font-weight:550}
  .spacer{margin-left:auto}
  .btn{background:var(--panel);border:1px solid var(--border-2);color:var(--ink);border-radius:var(--radius);padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:var(--font);display:inline-flex;gap:6px;align-items:center}
  .btn:hover{background:var(--hover)} .btn.solid{background:var(--solid);color:#fff;border-color:var(--solid)}
  /* table */
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
  th{font-size:11.5px;color:var(--ink-2);font-weight:550;background:#fafbfb}
  tr:last-child td{border-bottom:none}
  tr.row{cursor:pointer} tr.row:hover{background:var(--hover)}
  th.new,td.new{background:var(--new)} th.new{box-shadow:inset 0 2px 0 var(--new-line)}
  .newtag{font-size:9px;font-weight:700;color:var(--blue);background:#fff;border:1px solid var(--new-line);border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:middle;letter-spacing:.03em}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .up{background:var(--green)}.down{background:var(--red)}.warn{background:var(--amber)}
  .badge{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:5px;display:inline-flex;gap:5px;align-items:center;line-height:1.5}
  .badge.green{background:var(--green-bg);color:var(--green)}.badge.red{background:var(--red-bg);color:var(--red)}.badge.gray{background:var(--active);color:var(--ink-2)}.badge.blue{background:var(--blue-bg);color:var(--blue)}
  .flag{width:16px;height:11px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:5px}
  .mbar{height:5px;width:54px;background:var(--active);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
  .mbar>i{display:block;height:100%;background:var(--blue)}.mbar.warn>i{background:var(--amber)}.mbar.crit>i{background:var(--red)}
  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;cursor:pointer}.card:hover{border-color:var(--border-2);box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .card-h{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--border)}.card-h .nm{font-weight:600;font-size:14px}.card-h .meta{margin-left:auto;color:var(--ink-3)}
  .card-b{display:flex;gap:16px;padding:9px 14px;font-size:12.5px;color:var(--ink-2)}.card-b b{color:var(--ink)}
  .metrics{display:flex;gap:16px;padding:9px 14px;border-top:1px solid var(--border);background:var(--new)}
  .m{display:flex;gap:6px;align-items:center;font-size:12px}.mk{font-size:10px;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .mini{display:flex;gap:5px;align-items:center}
  /* detail header + tabs */
  .dhead{display:flex;align-items:center;gap:10px;margin:2px 0 4px}
  .dhead .t{font-size:18px;font-weight:600} .dhead .acts{margin-left:auto;display:flex;gap:7px}
  .tabbar{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:12px 0 16px;overflow-x:auto}
  .tab{padding:7px 11px;font-size:13px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tab:hover{color:var(--ink)} .tab.on{color:var(--ink);font-weight:550;border-bottom-color:var(--ink)}
  .tab.enh.on{border-bottom-color:var(--blue);color:var(--blue)}
  .stub{background:var(--panel);border:1px dashed var(--border-2);border-radius:8px;padding:26px;text-align:center;color:var(--ink-3);font-size:13px}
  .sec-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;margin:22px 0 9px}
  .toolbar{display:flex;align-items:center;gap:8px;margin:6px 0 9px}.toolbar .ttl{font-weight:600;font-size:13.5px;margin-right:auto;display:flex;gap:8px;align-items:center}
  .rowact{display:flex;gap:5px;opacity:0}tr.row:hover .rowact{opacity:1}
  .iact{background:var(--panel);border:1px solid var(--border-2);color:var(--ink-2);border-radius:5px;width:24px;height:24px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.iact:hover{background:var(--hover);color:var(--ink)}
  .hint{background:var(--amber-bg);border:1px solid #f3dcc0;border-radius:var(--radius);padding:9px 13px;font-size:12.5px;color:#7a4a12;margin:8px 0;display:flex;gap:8px;align-items:center}
  .link{color:var(--blue);cursor:pointer}.link:hover{text-decoration:underline}
  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(20,22,25,.35);opacity:0;pointer-events:none;transition:.15s;z-index:40}.scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(600px,92vw);background:var(--panel);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .18s;z-index:50;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.08)}.drawer.open{transform:translateX(0)}
  .dh{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--border)}.dh b{font-size:14px}.dh .x{margin-left:auto;background:none;border:none;color:var(--ink-3);font-size:20px;cursor:pointer}
  .dfiles{display:flex;gap:6px;padding:9px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}.dfiles .lbl{font-size:10.5px;text-transform:uppercase;color:var(--ink-3)}
  .chip{font-size:11.5px;padding:3px 9px;border-radius:5px;border:1px solid var(--border-2);background:var(--panel);color:var(--ink-2);cursor:pointer;font-family:var(--mono)}.chip.on{background:var(--active);color:var(--ink)}.chip.ext{opacity:.45;cursor:not-allowed}
  .dact{display:flex;gap:7px;padding:11px 16px;border-bottom:1px solid var(--border)}
  .logbody{flex:1;overflow:auto;padding:11px 16px;font-family:var(--mono);font-size:12px;line-height:1.7;background:#fcfcfd}
  .logline{display:flex;gap:10px;white-space:pre-wrap}.lt{color:var(--ink-3)}.lv{width:42px;font-weight:600}.lv.ERR{color:var(--red)}.lv.WARN{color:var(--amber)}.lv.INFO{color:var(--green)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">AS</div><div><div class="nm">Accurate Systems</div><div class="em">eslam@sanadeoi.com</div></div></div>
    <nav>
      <div class="nav-item"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg></span>Sites</div>
      <div class="nav-item"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>Benches</div>
      <div class="nav-item active"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="7" rx="1"/><rect x="3" y="13" width="18" height="7" rx="1"/></svg></span>Servers</div>
      <div class="nav-item"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l1-5h16l1 5M4 9v11h16V9"/></svg></span>Marketplace</div>
    </nav>
  </aside>
  <div class="main">
    <div class="babar">
      <span class="lbl">View:</span>
      <span class="ba"><button id="bBefore" class="on before" onclick="setMode('before')">Before</button><button id="bAfter" class="after" onclick="setMode('after')">After</button></span>
      <span class="desc" id="modeDesc"></span>
      <span class="legend"><span class="sw"></span> new in After</span>
    </div>
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="right" id="topRight"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><span class="dot down" id="dwDot"></span><b id="dwTitle">service</b><button class="x" onclick="closeDrawer()">&times;</button></div>
  <div class="dfiles" id="dwFiles"></div>
  <div class="dact"><button class="btn solid" onclick="act('restart')">Restart</button><button class="btn" onclick="act('start')">Start</button><button class="btn" onclick="act('stop')">Stop</button><span class="mono" id="dwMeta" style="margin-left:auto;align-self:center;color:var(--ink-3);font-size:11.5px"></span></div>
  <div class="logbody" id="logbody"></div>
</aside>

<script>
const FLAG={Frankfurt:'#222',Bahrain:'#ce1126',KSA:'#006c35'};
const SERVERS=[
  {id:'press-f1',name:'press-f1',status:'Active',plan:'Premium - 8 vCPU',db:'Premium - 8 vCPU',cluster:'Frankfurt',health:'down',cpu:34,mem:46,memUsed:'10.5',memTotal:'23G',disk:58},
  {id:'press-ctrl',name:'press-ctrl',status:'Active',plan:'Standard - 4 vCPU',db:'Standard - 4 vCPU',cluster:'Frankfurt',health:'warn',cpu:18,mem:49,memUsed:'7.8',memTotal:'16G',disk:69},
  {id:'u4',name:'u4-default',status:'Active',plan:'Standard - 4 vCPU',db:'Standard - 4 vCPU',cluster:'Bahrain',health:'up',cpu:12,mem:32,memUsed:'5.1',memTotal:'16G',disk:44},
  {id:'u5',name:'u5-default',status:'Active',plan:'Standard - 4 vCPU',db:'Standard - 4 vCPU',cluster:'KSA',health:'up',cpu:27,mem:88,memUsed:'14.1',memTotal:'16G',disk:51},
];
const BENCHES={'press-f1':[
  {id:'bench-0022-000037',title:'eltarak',version:'Version 15',status:'Active',health:'down',sites:1,svcUp:6,svcDown:1,cpu:9,mem:35},
  {id:'bench-0011-000195',title:'roseline',version:'Version 15',status:'Active',health:'up',sites:3,svcUp:7,svcDown:0,cpu:21,mem:73},
  {id:'bench-0023-000108',title:'dmg',version:'Version 14',status:'Active',health:'up',sites:1,svcUp:7,svcDown:0,cpu:6,mem:28},
]};
const BENCH={'bench-0022-000037':{services:[
  {name:'frappe-web',kind:'gunicorn web',state:'run',uptime:'2h 14m',pid:'72637'},
  {name:'node-socketio',kind:'realtime',state:'run',uptime:'2h 14m',pid:'72638'},
  {name:'frappe-schedule',kind:'scheduler',state:'run',uptime:'2h 14m',pid:'72662'},
  {name:'frappe-short-worker',kind:'worker',state:'run',uptime:'2h 14m',pid:'72749'},
  {name:'frappe-long-worker',kind:'worker',state:'run',uptime:'2h 14m',pid:'72752'},
  {name:'redis-cache',kind:'redis :13021',state:'run',uptime:'2h 14m',pid:'73442'},
  {name:'redis-queue',kind:'redis :11021',state:'stop',uptime:'-',pid:'-'},
],sites:[{name:'eltarak-app.sandbox.mvpstorm.com',status:'Active',http:'200',db:'1.4 GB',files:'320 MB',reqs:'42/min'}]}};
const LOGS={'redis-queue.log':[['10:48:21','ERR','bind: Address already in use (127.0.0.1:11021)'],['10:48:21','ERR','Failed listening on port 11021 (tcp), aborting.'],['10:48:24','INFO','redis-queue entered FATAL state, too many start retries']],'worker.error.log':[['10:49:58','ERR','ConnectionError: Error 111 connecting to 127.0.0.1:11021. Connection refused.']],'default':[['10:50:10','INFO','ok']]};
const LOGFILES={'redis-queue':['redis-queue.log'],'frappe-short-worker':['worker.log','worker.error.log'],'frappe-long-worker':['worker.log','worker.error.log']};
const EXT=['journalctl (agent ext)','docker logs (agent ext)'];
const TABS=['Overview','Analytics','Bench Analytics','Sites','Benches','Snapshots','Jobs','Plays','Actions','Auto Scale','Firewall','Tags','Activity'];

let mode='before', view={screen:'list',server:null,bench:null,tab:'Benches',listMode:'list'}, curSvc=null;
function bar(p){const c=p>=90?'crit':p>=75?'warn':'';return `<span class="mbar ${c}"><i style="width:${p}%"></i></span>`;}
function setMode(m){mode=m;document.getElementById('bBefore').className=m==='before'?'on before':'before';document.getElementById('bAfter').className=m==='after'?'on after':'after';render();}
function go(v){Object.assign(view,v);closeDrawer();render();document.querySelector('.content').scrollTo(0,0);}
function setList(m){view.listMode=m;render();}
function setTab(t){view.tab=t;view.bench=null;render();}

function render(){
  document.getElementById('modeDesc').textContent = mode==='before'?'the server pages as they are in production today':'the same pages with the proposed edits (metrics, card/list toggle, live services + control)';
  // crumb
  let h=`<a onclick="go({screen:'list',server:null,bench:null})">Servers</a>`;
  if(view.screen==='detail') h+=`<span class="sep">/</span><span class="cur">${view.server}</span>`;
  document.getElementById('crumb').innerHTML=h;
  // top right
  document.getElementById('topRight').innerHTML = (mode==='after' && view.screen==='detail') ? `<span class="live"><span class="pulse"></span> Auto-refresh 12s</span>` : '';
  const c=document.getElementById('content');
  c.innerHTML = view.screen==='list' ? renderList() : renderDetail();
}
function renderList(){
  const filters=`<div class="filterbar">
    <span class="fctl">Status: Active <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9l6 6 6-6"/></svg></span>
    <span class="fctl">Region: All <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9l6 6 6-6"/></svg></span>
    <input class="search" placeholder="Search servers...">
    <span class="spacer"></span>
    ${mode==='after'?`<span class="seg"><button class="${view.listMode==='card'?'on':''}" onclick="setList('card')">Cards</button><button class="${view.listMode==='list'?'on':''}" onclick="setList('list')">List</button></span>`:''}
    <button class="btn solid">+ New Server</button></div>`;
  if(mode==='after' && view.listMode==='card'){
    const cards=`<div class="grid">`+SERVERS.map(s=>{const bs=BENCHES[s.id]||[];const down=bs.filter(b=>b.health==='down').length;
      return `<div class="card" onclick="go({screen:'detail',server:'${s.id}',tab:'Benches'})">
        <div class="card-h"><span class="dot ${s.health}"></span><span class="nm">${s.name}</span><span class="meta"><span class="flag" style="background:${FLAG[s.cluster]}"></span>${s.cluster}</span></div>
        <div class="card-b"><span class="mini"><b>${bs.length||3}</b> benches</span><span class="mini">${down?`<span class="dot down"></span><b style="color:var(--red)">${down} affected</b>`:`<span class="dot up"></span> healthy`}</span></div>
        <div class="metrics"><span class="m"><span class="mk">CPU</span> ${s.cpu}% ${bar(s.cpu)}</span><span class="m"><span class="mk">Mem</span> ${s.mem}% ${bar(s.mem)}</span><span class="m"><span class="mk">Disk</span> ${s.disk}% ${bar(s.disk)}</span></div></div>`;}).join('')+`</div>`;
    return filters+cards;
  }
  const after=mode==='after';
  const head=`<tr><th></th><th>Server</th><th>Status</th>${after?`<th class="new">CPU <span class="newtag">NEW</span></th><th class="new">Mem</th><th class="new">Disk</th>`:''}<th>App Server Plan</th><th>Database Plan</th><th>Region</th></tr>`;
  const rows=SERVERS.map(s=>`<tr class="row" onclick="go({screen:'detail',server:'${s.id}',tab:'Benches'})">
    <td><span class="dot ${after?s.health:'up'}"></span></td><td><b>${s.name}</b></td>
    <td><span class="badge ${after&&s.health==='down'?'red':'green'}">${s.status}</span></td>
    ${after?`<td class="new"><span class="mono">${s.cpu}%</span> ${bar(s.cpu)}</td><td class="new"><span class="mono">${s.mem}%</span> ${bar(s.mem)}</td><td class="new"><span class="mono">${s.disk}%</span> ${bar(s.disk)}</td>`:''}
    <td>${s.plan}</td><td>${s.db}</td><td><span class="flag" style="background:${FLAG[s.cluster]}"></span>${s.cluster}</td></tr>`).join('');
  return filters+`<table>${head}${rows}</table>`;
}
function renderDetail(){
  const s=SERVERS.find(x=>x.id===view.server)||SERVERS[0];
  const head=`<div class="dhead"><span class="dot ${mode==='after'?s.health:'up'}"></span><span class="t">${s.name}</span><span class="badge ${mode==='after'&&s.health==='down'?'red':'green'}">${s.status}</span>
    <span class="acts"><button class="btn">Impersonate Owner</button><button class="btn">Options <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9l6 6 6-6"/></svg></button></span></div>`;
  const tabs=`<div class="tabbar">`+TABS.map(t=>{const enh=(mode==='after'&&(t==='Benches'||t==='Overview'));return `<div class="tab ${t===view.tab?'on':''} ${enh?'enh':''}" onclick="setTab('${t}')">${t}${enh?' <span class="newtag">+</span>':''}</div>`;}).join('')+`</div>`;
  let body;
  if(view.tab==='Benches') body=renderBenchesTab(s);
  else if(view.tab==='Overview') body=renderOverview(s);
  else body=`<div class="stub">Existing "${view.tab}" tab - kept exactly as-is (unchanged by this edit).</div>`;
  return head+tabs+body;
}
function renderOverview(s){
  const base=`<div style="display:flex;gap:13px;flex-wrap:wrap"><div class="card" style="cursor:default;flex:1;min-width:260px"><div class="card-h"><span class="nm">Server Information</span></div><div style="padding:12px 14px;font-size:13px;color:var(--ink-2);line-height:1.9"><div>Owner team &nbsp; <b style="color:var(--ink)">Accurate Systems</b></div><div>Region &nbsp; <b style="color:var(--ink)">${s.cluster}</b></div><div>Plan &nbsp; <b style="color:var(--ink)">${s.plan}</b></div><div>Storage &nbsp; <b style="color:var(--ink)">${s.disk}% of 300 GB</b></div></div></div>`;
  if(mode==='before') return base+`<div class="card" style="cursor:default;flex:1;min-width:260px"><div class="card-h"><span class="nm">Storage</span></div><div style="padding:14px"><div style="font-size:12px;color:var(--ink-2);margin-bottom:6px">Disk usage</div><div class="mbar" style="width:100%;height:8px"><i style="width:${s.disk}%"></i></div></div></div></div>`;
  return base+`<div class="card" style="cursor:default;flex:1;min-width:260px"><div class="card-h"><span class="nm">Live resources</span><span class="newtag" style="margin-left:8px">NEW</span></div><div class="metrics" style="flex-direction:column;align-items:stretch;gap:11px"><span class="m"><span class="mk" style="width:34px">CPU</span> ${s.cpu}% ${bar(s.cpu)}</span><span class="m"><span class="mk" style="width:34px">Mem</span> ${s.mem}% ${bar(s.mem)}</span><span class="m"><span class="mk" style="width:34px">Disk</span> ${s.disk}% ${bar(s.disk)}</span></div><div style="padding:0 14px 12px"><span class="link" style="font-size:12px">View history in Analytics tab</span></div></div></div>`;
}
function renderBenchesTab(s){
  const bs=BENCHES[s.id]||BENCHES['press-f1'];
  if(view.bench) return renderBenchPanel(view.bench);
  const after=mode==='after';
  const tb=`<div class="toolbar"><span class="ttl">Benches (${bs.length})</span><button class="btn solid">+ New Bench</button></div>`;
  const head=`<tr><th>Bench</th><th>Version</th><th>Status</th>${after?`<th class="new">Services <span class="newtag">NEW</span></th><th class="new">CPU</th><th class="new">Mem</th>`:''}<th>Sites</th></tr>`;
  const rows=bs.map(b=>`<tr class="row" onclick="${after?`go({bench:'${b.id}'})`:`void 0`}">
    <td><b>${b.title}</b> <span class="mono" style="color:var(--ink-3)">${b.id}</span></td><td>${b.version}</td>
    <td><span class="badge ${after&&b.health==='down'?'red':'green'}">${b.status}</span></td>
    ${after?`<td class="new">${b.svcDown?`<span class="badge red">${b.svcDown} down</span>`:`<span class="badge green">${b.svcUp} up</span>`}</td><td class="new"><span class="mono">${b.cpu}%</span> ${bar(b.cpu)}</td><td class="new"><span class="mono">${b.mem}%</span> ${bar(b.mem)}</td>`:''}
    <td>${b.sites}</td></tr>`).join('');
  const note=after?`<div class="hint" style="background:var(--new);border-color:var(--new-line);color:var(--blue)"><span class="dot" style="background:var(--blue)"></span> After: bench rows now show live service up/down + CPU/Mem, and click a bench to drill into its services + logs + restart (below).</div>`:'';
  return note+tb+`<table>${head}${rows}</table>`;
}
function renderBenchPanel(bid){
  const d=BENCH[bid]||BENCH['bench-0022-000037'];const hasDown=d.services.some(x=>x.state!=='run');
  const back=`<div style="margin-bottom:10px"><span class="link" onclick="go({bench:null})">&larr; Back to benches</span></div>`;
  const svc=d.services.map(x=>`<tr class="row" onclick="openLog('${x.name}','${bid}',event)"><td><span class="dot ${x.state==='run'?'up':'down'}"></span> ${x.name}</td><td class="mono">${x.kind}</td><td>${x.state==='run'?`<span class="badge green">running</span>`:`<span class="badge red">stopped</span>`}</td><td class="mono">${x.uptime}</td><td class="mono">${x.pid}</td><td><div class="rowact" onclick="event.stopPropagation()"><button class="iact" title="Restart" onclick="act('restart')">&#10227;</button><button class="iact" title="Stop" onclick="act('stop')">&#9632;</button><button class="iact" title="Log" onclick="openLog('${x.name}','${bid}',event)">&#9776;</button></div></td></tr>`).join('');
  const sites=d.sites.map(si=>`<tr><td><span class="dot up"></span> ${si.name}</td><td><span class="badge green">${si.status}</span></td><td class="mono">HTTP ${si.http}</td><td class="mono">${si.db}</td><td class="mono">${si.files}</td><td class="mono">${si.reqs}</td></tr>`).join('');
  return back+(hasDown?`<div class="hint"><span class="dot down"></span> redis-queue is down. Click the red row to read its log, then Restart it inline.</div>`:'')+
    `<div class="toolbar"><span class="ttl"><span class="dot ${hasDown?'down':'up'}"></span> ${bid} &middot; Services (${d.services.length})</span><button class="btn">Restart web only</button><button class="btn solid">Restart bench</button></div>
    <table><tr><th>Service</th><th>Type</th><th>State</th><th>Uptime</th><th>PID</th><th></th></tr>${svc}</table>
    <div class="sec-h">Sites on this bench</div><table><tr><th>Site</th><th>Status</th><th>Check</th><th>DB</th><th>Files</th><th>Requests</th></tr>${sites}</table>`;
}
function openLog(svc,bid,ev){if(ev)ev.stopPropagation();curSvc=svc;
  const down=BENCH[bid]&&BENCH[bid].services.find(x=>x.name===svc&&x.state!=='run');
  document.getElementById('dwDot').className='dot '+(down?'down':'up');document.getElementById('dwTitle').textContent=svc;document.getElementById('dwMeta').textContent=bid;
  const files=LOGFILES[svc]||[svc+'.log'];
  document.getElementById('dwFiles').innerHTML=`<span class="lbl">log files</span>`+files.map((f,i)=>`<span class="chip ${i===0?'on':''}" onclick="loadLog('${f}',this)">${f}</span>`).join('')+EXT.map(f=>`<span class="chip ext" title="needs bench.logs extension via the Press Agent">${f}</span>`).join('');
  loadLog(files[0]);document.getElementById('drawer').classList.add('open');document.getElementById('scrim').classList.add('open');
}
function loadLog(f,el){if(el){document.querySelectorAll('#dwFiles .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');}const lines=LOGS[f]||LOGS['default'];document.getElementById('logbody').innerHTML=lines.map(l=>`<div class="logline"><span class="lt">${l[0]}</span><span class="lv ${l[1]}">${l[1]}</span><span>${l[2]}</span></div>`).join('');}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('open');}
function act(v){alert('[prototype] would call press.api.bench.service_action: '+v+' '+(curSvc||'service')+' (Plan 1 backend, shipped)');}
render();
</script>
</body>
</html>
